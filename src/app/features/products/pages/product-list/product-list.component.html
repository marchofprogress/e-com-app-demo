<section class="product-list">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    @for (product of products(); track product.id) {
    <app-product
      [product]="product"
      [currentMinOrderAmount]="product.currentMinOrderAmount"
      (addedProductEmitter)="addToCart($event)"
    ></app-product>
    } @if (isLoading()) {
    <div>Loading</div>
    } @if (hasError()) {
    <div>Error</div>
    }
  </div>
</section>
